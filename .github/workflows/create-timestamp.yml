name: Record Execution Timestamp

on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run trigger script
        run: python .github/script/trigger.py

      - name: Commit execution log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/execution_log.json
          git diff --cached --quiet || git commit -m "Record execution timestamp"
          git push
